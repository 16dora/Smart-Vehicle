# 普通请求和 WebSocket 分别使用合适的连接头，共用公开 HTTPS 入口。
map $http_upgrade $sv_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 124.223.192.76;
    location /.well-known/acme-challenge/ { root /var/www/smart-vehicle-acme; }
    location / { return 301 https://124.223.192.76$request_uri; }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 124.223.192.76;
    ssl_certificate /etc/smart-vehicle/server_ca.pem;
    ssl_certificate_key /etc/smart-vehicle/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 512k;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sv_upgrade;
        proxy_buffering off;
        proxy_read_timeout 20s;
        proxy_send_timeout 5s;
    }
}

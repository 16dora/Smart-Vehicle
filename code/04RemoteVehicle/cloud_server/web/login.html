<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小车控制 · 登录</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0c1220;color:#e4eaf4;font:15px system-ui,sans-serif;padding:24px}.card{width:100%;max-width:390px;padding:32px;background:#172235;border:1px solid #2b3c56;border-radius:16px}h1{font-size:24px;margin:0 0 8px}p{color:#9eafc5;line-height:1.6}label{display:block;margin-top:20px}input,button{width:100%;padding:12px 14px;border-radius:8px;font:inherit}input{margin-top:8px;border:1px solid #40526d;background:#0c1728;color:inherit}button{margin-top:26px;border:0;background:#4593ff;color:white;cursor:pointer}button:disabled{opacity:.6}#message{min-height:24px;color:#ffaaaa;margin:16px 0 0}a{color:#a8ceff}
</style>
</head>
<body><main class="card"><h1>小车控制</h1><p>请使用指定账号登录。</p>
<form id="loginForm"><label for="username">账号</label><input id="username" name="username" autocomplete="username" required maxlength="64">
<label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128">
<button id="submit" type="submit">登录</button><p id="message" role="alert"></p></form></main>
<script>
// 输入：提交事件；输出：登录状态；作用：密码仅通过 HTTPS 正文提交，不保存到浏览器存储。
async function login(event) {
  event.preventDefault();
  const button = document.getElementById('submit');
  const message = document.getElementById('message');
  button.disabled = true; message.textContent = '';
  try {
    const response = await fetch('/api/login', {method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});
    const result = await response.json();
    document.getElementById('password').value = '';
    if (!response.ok) throw new Error(result.message || '登录失败');
    location.replace('/');
  } catch(error) { message.textContent = error.message || '连接失败，请稍后重试'; }
  finally { button.disabled = false; }
}
document.getElementById('loginForm').addEventListener('submit', login);
</script></body></html>
